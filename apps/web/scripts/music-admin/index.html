<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Admin · Not an Angel</title><style>body{background:#111;color:#eee;font:16px system-ui;margin:24px auto;max-width:1000px;padding:0 16px}h1{color:#ffe600}label{display:block;margin:12px 0}input,textarea,select,button{font:inherit;padding:9px;background:#222;color:#fff;border:1px solid #666;border-radius:4px;box-sizing:border-box}input,textarea{width:100%}textarea{min-height:100px}button{cursor:pointer;margin:4px}button.primary{background:#ffe600;color:#111}fieldset{margin:16px 0;border:1px solid #555}pre{white-space:pre-wrap}small{color:#bbb}</style><h1>NOT AN ANGEL / MUSIC ADMIN</h1><p>Editor local · Git + MDX · No publica en producción automáticamente.</p><select id="catalog" aria-label="Publicaciones"></select><button id="open">Abrir</button><select id="category" aria-label="Categoría"><option>dj-edits</option><option>dj-mixes</option><option>dj-sets</option></select><button id="new">Nueva publicación</button><form id="editor" hidden><div id="fields"></div><button type="button" id="validate">Validar</button><button type="submit" class="primary">Guardar en repositorio</button></form><pre id="message" role="status"></pre><script>
const $=id=>document.getElementById(id), token='__TOKEN__';let current,entries=[];const fields=[];
async function api(path,data){const r=await fetch(path,{method:data===undefined?'GET':'POST',headers:{'x-admin-token':token,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error);return result;}
function field(parent,label,path,kind='text'){const l=document.createElement('label');l.textContent=label;const el=document.createElement(kind==='json'||kind==='area'?'textarea':'input');if(kind==='bool')el.type='checkbox';else if(kind==='number')el.type='number';const value=path.reduce((o,k)=>o?.[k],current);if(kind==='bool')el.checked=!!value;else el.value=kind==='json'?JSON.stringify(value??[],null,2):value??'';l.append(el);parent.append(l);fields.push({el,path,kind});}
function show(data){current=data;fields.length=0;const p=$('fields');p.replaceChildren();for(const [k,l,t] of [['id','ID'],['slug','Slug'],['category','Categoría'],['status','Estado (draft / published)'],['publishedAt','Fecha YYYY-MM-DD'],['featured','Destacado','bool'],['youtubeId','URL o ID de YouTube'],['cover','Ruta local carátula'],['thumbnail','Ruta local miniatura'],['durationSeconds','Duración en segundos','number'],['bpm','BPM','number'],['key','Tonalidad'],['artists','Artistas (JSON)','json'],['genres','Géneros (JSON)','json'],['originalTracks','Créditos originales (JSON: title, artist)','json'],['downloadFilename','Nombre de descarga (sin extensión)'],['downloads','Descargas (JSON: id, format, label, rights, enabled, bytes)','json']])field(p,l,[k],t);const preview=document.createElement('pre');preview.setAttribute('aria-live','polite');const updatePreview=()=>{try{const data=collect();preview.textContent='Nombres de descarga (vista previa):\n'+(data.downloads.map(d=>`${data.downloadFilename??`${data.slug}-${d.id}`}.${d.format}`).join('\n')||'Sin formatos configurados');}catch{preview.textContent='Revisa el JSON de descargas.';}};p.append(preview);for(const f of fields)if(['downloadFilename','downloads','slug'].includes(f.path[0]))f.el.addEventListener('input',updatePreview);updatePreview();const check=document.createElement('button');check.type='button';check.textContent='Comprobar archivos R2 y actualizar tamaños';check.onclick=()=>run(async()=>{check.disabled=true;try{const data=collect(), f=fields.find(x=>x.path[0]==='downloads');const results=[];for(const d of data.downloads){try{const r=await api('/check-r2',{category:data.category,slug:data.slug,id:d.id,format:d.format});d.bytes=r.bytes;results.push(r.key+' · '+r.bytes+' bytes');}catch(e){delete d.bytes;d.enabled=false;results.push(d.id+': '+e.message+' (deshabilitado)');}}f.el.value=JSON.stringify(data.downloads,null,2);return results.join('\n');}finally{check.disabled=false;}});p.append(check);const paths=document.createElement('button');paths.type='button';paths.textContent='Mostrar rutas R2';paths.onclick=()=>run(()=>{const d=collect();return d.downloads.map(x=>`${d.category}/${d.slug}/${x.id}.${x.format}\nhttps://downloads.notanangeldj.com/download/${d.id}/${x.id}`).join('\n\n');});p.append(paths);for(const lang of ['en','es']){const f=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=lang.toUpperCase();f.append(legend);for(const k of ['title','description','metaTitle','metaDescription','coverAlt'])field(f,k,['locales',lang,k]);field(f,'Contenido MDX',['bodies',lang],'area');p.append(f);}if(data.category==='dj-sets')field(p,'Tracklist (JSON: title, artist, startSeconds, releaseId)',['tracklist'],'json');$('editor').hidden=false;}
function collect(){const out=structuredClone(current);for(const {el,path,kind} of fields){const parent=path.slice(0,-1).reduce((o,k)=>o[k],out),k=path.at(-1);parent[k]=kind==='json'?JSON.parse(el.value):kind==='bool'?el.checked:kind==='number'?(el.value===''?undefined:Number(el.value)):el.value;if(k==='downloadFilename')parent[k]=parent[k].trim();if(['publishedAt','youtubeId','cover','thumbnail','key','downloadFilename'].includes(k)&&!parent[k])delete parent[k];}return out;}
async function run(fn){try{$('message').textContent=await fn()??'';}catch(e){$('message').textContent=e.message;}}
async function refresh(){entries=await api('/catalog');$('catalog').replaceChildren(...entries.map((e,i)=>new Option(`${e.status} · ${e.category} · ${e.slug}`,i)));}
$('new').onclick=()=>run(async()=>{show(await api('/new?category='+$('category').value));});$('open').onclick=()=>run(()=>{if(entries.length)show(entries[Number($('catalog').value)]);});$('validate').onclick=()=>run(async()=>JSON.stringify(await api('/validate',collect()),null,2));$('editor').onsubmit=e=>{e.preventDefault();run(async()=>{const data=collect();if(data.status==='published'&&!confirm('Marcar como publicado en el catálogo local?'))return 'Cancelado';const result=await api('/save',data);await refresh();show(entries.find(x=>x.id===result.id));return 'Guardado: '+result.slug;});};run(refresh);
</script></html>
